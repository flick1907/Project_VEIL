<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project VEIL Fixture</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.45; }
      label, input, button { display: block; margin: .45rem 0; }
      input { width: min(420px, 100%); padding: .4rem; }
      #veil-result { padding: .8rem; background: #eff6ff; border: 1px solid #93c5fd; min-height: 1.2rem; }
    </style>
  </head>
  <body>
    <h1>Booking assistance fixture</h1>
    <p id="booking-status" data-veil-observe="true" data-veil-label="Booking status">Booking ready for review</p>
    <label for="name">Name</label>
    <input id="name" data-veil-observe="true" data-veil-label="Name" value="Asha Kumar" />
    <label for="email">Email</label>
    <input id="email" type="email" data-veil-observe="true" data-veil-label="Email" value="asha@example.com" />
    <label for="phone">Phone</label>
    <input id="phone" type="tel" data-veil-observe="true" data-veil-label="Phone" value="+91 9876543210" />
    <label for="password">Password</label>
    <input id="password" type="password" data-veil-observe="true" data-veil-label="Password" value="demo-secret" />
    <label for="order-id">Booking ID</label>
    <input id="order-id" data-veil-observe="true" data-veil-label="Booking ID" value="BOOK-26171" />
    <label for="travel-date">Date</label>
    <input id="travel-date" type="date" data-veil-observe="true" data-veil-label="Travel date" value="2026-10-01" />
    <label for="search">Search bookings</label>
    <input id="search" type="search" data-veil-observe="true" data-veil-label="Search bookings" value="" />
    <button id="find-booking" data-veil-observe="true" data-veil-label="Find booking">Find booking</button>
    <p id="veil-result">VEIL: extension idle</p>
  </body>
</html>
