<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEIL Retro UI</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="desktop">
        <div class="window main-window" id="veil-main-window">
            <div class="title-bar">
                <div class="title-bar-text">VEIL Privacy Assistant</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body">
                <div class="tabs">
                    <button class="tab active" data-tab="status">Status</button>
                    <button class="tab" data-tab="settings">Settings</button>
                    <button class="tab" data-tab="logs">Logs</button>
                </div>
                
                <div class="tab-content" id="tab-status">
                    <div class="status-panel">
                        <div class="field-row">
                            <label>Session:</label>
                            <span class="status-text">READY</span>
                        </div>
                        <div class="field-row">
                            <label>DOM Observer:</label>
                            <input type="checkbox" id="checkbox-observer" disabled>
                        </div>
                        <div class="field-row">
                            <label>Visual Fallback:</label>
                            <input type="checkbox" id="checkbox-fallback" disabled>
                        </div>
                        <fieldset>
                            <legend>Local Perception</legend>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 0%;"></div>
                            </div>
                            <p class="small-text">Waiting for extension execution...</p>
                        </fieldset>
                        <fieldset>
                            <legend>Privacy Gate</legend>
                            <div class="field-row">
                                <input type="radio" id="gate-verified" name="gate" disabled>
                                <label for="gate-verified">Verified Context Only</label>
                            </div>
                            <div class="field-row">
                                <input type="radio" id="gate-blocked" name="gate" disabled>
                                <label for="gate-blocked">Blocked</label>
                            </div>
                        </fieldset>
                    </div>
                    <div class="action-buttons">
                        <button class="btn default-btn" id="btn-authorize">Authorize Action</button>
                        <button class="btn" id="btn-cancel">Cancel</button>
                    </div>
                </div>

                <div class="tab-content hidden" id="tab-settings">
                    <fieldset>
                        <legend>Redaction Policy</legend>
                        <div class="field-row">
                            <input type="checkbox" id="mask-pwd" checked>
                            <label for="mask-pwd">Mask Passwords</label>
                        </div>
                        <div class="field-row">
                            <input type="checkbox" id="mask-pii" checked>
                            <label for="mask-pii">Mask PII (Emails, Phones)</label>
                        </div>
                        <div class="field-row">
                            <input type="checkbox" id="blur-face" checked>
                            <label for="blur-face">Blur Faces</label>
                        </div>
                    </fieldset>
                </div>

                <div class="tab-content hidden" id="tab-logs">
                    <ul class="tree-view">
                    </ul>
                </div>
            </div>
            
            <div class="status-bar">
                <p class="status-bar-field">Status: Ready</p>
                <p class="status-bar-field">v1.0.0-MVP</p>
            </div>
        </div>
        
        <!-- Action Validator Dialog -->
        <div class="window dialog-window hidden" id="action-dialog">
            <div class="title-bar">
                <div class="title-bar-text">Action Validator</div>
                <div class="title-bar-controls">
                    <button aria-label="Close" id="btn-dialog-close"></button>
                </div>
            </div>
            <div class="window-body">
                <div class="dialog-content">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><circle cx='16' cy='16' r='14' fill='%23000080'/><text x='16' y='22' font-family='Arial' font-size='20' font-weight='bold' fill='white' text-anchor='middle'>?</text></svg>" alt="question" class="dialog-icon">
                    <p>Server proposes: <strong>Click 'Submit'</strong>.<br>This requires user confirmation.</p>
                </div>
                <div class="dialog-buttons">
                    <button class="btn default-btn" id="btn-dialog-allow">Allow</button>
                    <button class="btn" id="btn-dialog-deny">Deny</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
